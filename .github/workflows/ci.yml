name: ci by raj

on:
  push:

jobs:
  build: # job ka naam
    runs-on: ubuntu-latest # GitHub ka free Ubuntu runner

    steps:
      - name: Checkout code # code ko runner me clone karta hai
        uses: actions/checkout@v4

      - name: Set up Docker Buildx # Docker build setup
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub #docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push # docker image ko build kero 
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: raj24kush/skillpuls:latest